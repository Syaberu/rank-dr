<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCsyaberu's Tier - DeathRun Rankings</title>
    <script src="data.js"></script>
    <style>
        :root {
            --bg-body: #0a0a0c;
            --bg-card: #141417;
            --bg-nav: #1b1b1f;
            --accent-cyan: #00d2ff;
            --tier-ht: #ffb400;
            --tier-lt: #8e8e93;
            --text-main: #eeeeee;
            --text-sub: #8e8e93;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- ナビゲーション --- */
        .header-nav { display: flex; gap: 15px; background: var(--bg-nav); padding: 8px; border-radius: 12px; margin-bottom: 30px; }
        .mode-btn { background: none; border: none; color: var(--text-sub); padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .mode-btn.active { background: #2c2c34; color: #fff; }

        .map-tabs { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; width: 100%; max-width: 900px; justify-content: center; scrollbar-width: none; }
        .map-tab { background: var(--bg-nav); border: none; color: var(--text-sub); padding: 12px 20px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
        .map-tab.active { background: var(--accent-cyan); color: #000; }

        /* --- ランキングアイテム --- */
        .ranking-list { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 8px; }
        
        .rank-item {
            display: grid;
            grid-template-columns: 60px 60px 1fr 100px 300px; /* 横幅調整 */
            align-items: center;
            background-color: var(--bg-card);
            padding: 8px 20px;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.03);
        }

        /* 斜めカット装飾 */
        .rank-item.top-rank::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 100px;
            clip-path: polygon(0 0, 100% 0, 70% 100%, 0% 100%); z-index: 1;
        }
        .rank-1::before { background: linear-gradient(90deg, #ffb400 0%, #ff8c00 100%); opacity: 0.8; }
        .rank-2::before { background: linear-gradient(90deg, #b0b0b0 0%, #808080 100%); opacity: 0.6; }
        .rank-3::before { background: linear-gradient(90deg, #cd7f32 0%, #a0522d 100%); opacity: 0.5; }

        .rank-number { font-size: 1.8rem; font-weight: 900; font-style: italic; z-index: 2; text-align: center; color: #fff; }
        .skin-container { z-index: 2; display: flex; justify-content: center; }
        .skin-img { width: 44px; height: 44px; image-rendering: pixelated; border-radius: 4px; background: #222; }

        .player-info { padding-left: 15px; }
        .player-name { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .player-title { font-size: 0.75rem; color: var(--text-sub); display: flex; align-items: center; gap: 5px; }
        .title-icon { color: #ffb400; font-size: 0.8rem; } /* 称号の前のアイコン */

        .region-badge {
            background: #2a2a2e;
            color: #ff4d4d;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 0;
            width: 45px;
            border-radius: 4px;
            text-align: center;
            justify-self: center;
        }
        .region-EU { color: #4d94ff; } /* EUは青っぽく等、CSSで色分け可能 */

        /* --- ティア並び (16x16画像対応) --- */
        .tiers-row { display: flex; gap: 10px; justify-content: flex-end; }
        .tier-mini-box { display: flex; flex-direction: column; align-items: center; min-width: 32px; }
        .map-icon-img { width: 18px; height: 18px; image-rendering: pixelated; margin-bottom: 4px; opacity: 0.9; }
        .tier-label { font-size: 0.65rem; font-weight: 800; text-align: center; }
        .label-ht { color: #ffb400; }
        .label-lt { color: #8e8e93; }
        .label-none { color: #444; }

        /* モバイル対応 */
        @media screen and (max-width: 850px) {
            .rank-item { grid-template-columns: 50px 50px 1fr 60px; padding: 10px; }
            .tiers-row { display: none; }
            .rank-item.top-rank::before { width: 70px; }
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <button id="btn-solos" class="mode-btn active" onclick="setGameMode('solos')">Solos</button>
        <button id="btn-duos" class="mode-btn" onclick="setGameMode('duos')">Duos</button>
    </div>

    <div class="map-tabs">
        <button class="map-tab active" onclick="updateMap('Overall', this)">Overall</button>
        <button class="map-tab" onclick="updateMap('Cave', this)">Cave</button>
        <button class="map-tab" onclick="updateMap('Flora', this)">Flora</button>
        <button class="map-tab" onclick="updateMap('Gardens', this)">Gardens</button>
        <button class="map-tab" onclick="updateMap('Metropolis', this)">Metropolis</button>
    </div>

    <div class="ranking-list" id="ranking-body"></div>

    <script>
        let currentGameMode = 'solos';
        let currentMap = 'Overall';

        function setGameMode(mode) {
            currentGameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            render();
        }

        function updateMap(map, btn) {
            currentMap = map;
            document.querySelectorAll('.map-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function getTierIdx(tier) {
            if (!tier || tier === "-") return 999;
            return TIER_ORDER.indexOf(tier);
        }

        function getValidSum(p) {
            return Object.values(p.mapTiers).reduce((acc, m) => acc + (m.record < 900 ? m.record : 0), 0);
        }

        function render() {
            const body = document.getElementById('ranking-body');
            body.innerHTML = '';
            
            const dataSource = (currentGameMode === 'solos') ? players : (typeof duos !== 'undefined' ? duos : []);
            let sorted = [...dataSource];

            sorted.sort((a, b) => {
                if (currentMap === 'Overall') {
                    const sumA = getValidSum(a);
                    const sumB = getValidSum(b);
                    if (sumA === 0) return 1;
                    if (sumB === 0) return -1;
                    return sumA - sumB || b.rating - a.rating;
                } else {
                    const mA = a.mapTiers[currentMap];
                    const mB = b.mapTiers[currentMap];
                    const idxA = getTierIdx(mA.tier);
                    const idxB = getTierIdx(mB.tier);
                    if (idxA !== idxB) return idxA - idxB;
                    return mA.record - mB.record || b.rating - a.rating;
                }
            });

            sorted.forEach((p, i) => {
                const isTop = i < 3;
                const rankClass = isTop ? `top-rank rank-${i+1}` : '';
                const name = p.name || p.pairName;
                const region = p.region || "NA";
                const title = p.title || "Combat Ace";
                
                // ティア行の生成 (mapsフォルダーの画像を使用)
                let tiersHtml = '';
                const maps = ['Cave', 'Flora', 'Gardens', 'Metropolis'];
                maps.forEach(m => {
                    const d = p.mapTiers[m];
                    const tier = d ? d.tier : "-";
                    const labelClass = tier.startsWith("HT") ? "label-ht" : (tier.startsWith("LT") ? "label-lt" : "label-none");
                    
                    // マップ名に応じた画像を表示 (例: maps/Cave.png)
                    tiersHtml += `
                        <div class="tier-mini-box">
                            <img src="maps/${m}.png" class="map-icon-img" alt="${m}" onerror="this.style.display='none'">
                            <div class="tier-label ${labelClass}">${tier === "-" ? "-" : tier}</div>
                        </div>`;
                });

                body.innerHTML += `
                    <div class="rank-item ${rankClass}">
                        <div class="rank-number">${i + 1}.</div>
                        <div class="skin-container">
                            <img src="skins/${p.name}.png" class="skin-img" onerror="this.src='skins/default.png'">
                        </div>
                        <div class="player-info">
                            <div class="player-name">${name}</div>
                            <div class="player-title">
                                <span class="title-icon">◈</span> ${title} (${p.rating} points)
                            </div>
                        </div>
                        <div class="region-badge region-${region}">${region}</div>
                        <div class="tiers-row">
                            ${tiersHtml}
                        </div>
                    </div>
                `;
            });
        }
        window.onload = render;
    </script>
</body>
</html>
