<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeathRun Rankings - Elite UI</title>
    <script src="data.js"></script>
    <style>
        :root {
            --bg-body: #0a0a0c;
            --bg-card: #141417;
            --bg-nav: #1b1b1f;
            --accent-cyan: #00d2ff;
            --tier-ht: #ffb400;
            --tier-lt: #8e8e93;
            --text-main: #eeeeee;
            --text-sub: #8e8e93;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- ナビゲーション --- */
        .header-nav { display: flex; gap: 15px; background: var(--bg-nav); padding: 8px; border-radius: 12px; margin-bottom: 30px; }
        .mode-btn { background: none; border: none; color: var(--text-sub); padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .mode-btn.active { background: #2c2c34; color: #fff; }

        .map-tabs { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; width: 100%; max-width: 900px; justify-content: center; scrollbar-width: none; }
        .map-tab { background: var(--bg-nav); border: none; color: var(--text-sub); padding: 12px 20px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
        .map-tab.active { background: var(--accent-cyan); color: #000; }

        /* --- ランキングリスト --- */
        .ranking-list { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 10px; }
        
        .rank-item {
            display: grid;
            /* カラム設定: 順位(60px) | スキン(60px) | 名前(1fr) | 地域(80px) | ティア・タイム(320px) */
            grid-template-columns: 60px 60px 1fr 80px 320px;
            align-items: center;
            background-color: var(--bg-card);
            padding: 12px 0;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.03);
        }

        /* --- 上位ランクの斜め背景 (スキンと被らないように幅を制限) --- */
        .rank-item.top-rank::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 75px; /* 順位の数字部分だけに限定 */
            clip-path: polygon(0 0, 100% 0, 75% 100%, 0% 100%);
            z-index: 1;
        }
        .rank-1::before { background: linear-gradient(90deg, #ffb400 0%, #ff8c00 100%); opacity: 0.9; }
        .rank-2::before { background: linear-gradient(90deg, #b0b0b0 0%, #808080 100%); opacity: 0.7; }
        .rank-3::before { background: linear-gradient(90deg, #cd7f32 0%, #a0522d 100%); opacity: 0.6; }

        .rank-number {
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            z-index: 2; /* 背景より上に表示 */
            text-align: center;
            padding-right: 10px; /* 斜めカットの内側に収める */
        }

        /* スキン画像 (背景と被らないように配置) */
        .skin-container {
            z-index: 2;
            display: flex;
            justify-content: center;
            position: relative;
        }
        .skin-img {
            width: 46px;
            height: 46px;
            image-rendering: pixelated;
            border-radius: 6px;
            background: #222;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-info { padding-left: 20px; }
        .player-name { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .player-title { font-size: 0.75rem; color: var(--text-sub); display: flex; align-items: center; gap: 5px; }
        .title-icon { color: #ffb400; font-size: 0.8rem; }

        .region-badge {
            background: #2a2a2e;
            color: #ff4d4d;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
            justify-self: center;
        }

        /* --- タイム & ティア セクション --- */
        .status-section {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 25px;
            padding-right: 25px;
        }

        .time-box { text-align: right; min-width: 80px; }
        .time-label { font-size: 0.6rem; color: var(--text-sub); display: block; }
        .time-value { font-family: 'Consolas', monospace; color: var(--accent-cyan); font-weight: bold; font-size: 1.1rem; }

        .tiers-row { display: flex; gap: 12px; }
        .tier-mini-box { display: flex; flex-direction: column; align-items: center; min-width: 32px; }
        .map-icon-img { width: 18px; height: 18px; image-rendering: pixelated; margin-bottom: 4px; }
        
        .tier-label { font-size: 0.65rem; font-weight: 800; }
        .label-ht { color: #ffb400; }
        .label-lt { color: #8e8e93; }
        .label-none { color: #444; }

        /* モバイル対応 */
        @media screen and (max-width: 850px) {
            .rank-item { grid-template-columns: 50px 50px 1fr 60px; }
            .status-section { display: none; }
            .rank-item.top-rank::before { width: 60px; }
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <button id="btn-solos" class="mode-btn active" onclick="setGameMode('solos')">Solos</button>
        <button id="btn-duos" class="mode-btn" onclick="setGameMode('duos')">Duos</button>
    </div>

    <div class="map-tabs">
        <button class="map-tab active" onclick="updateMap('Overall', this)">Overall</button>
        <button class="map-tab" onclick="updateMap('Cave', this)">Cave</button>
        <button class="map-tab" onclick="updateMap('Flora', this)">Flora</button>
        <button class="map-tab" onclick="updateMap('Gardens', this)">Gardens</button>
        <button class="map-tab" onclick="updateMap('Metropolis', this)">Metropolis</button>
    </div>

    <div class="ranking-list" id="ranking-body"></div>

    <script>
        let currentGameMode = 'solos';
        let currentMap = 'Overall';

        function setGameMode(mode) {
            currentGameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            render();
        }

        function updateMap(map, btn) {
            currentMap = map;
            document.querySelectorAll('.map-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function formatTime(seconds) {
            if (seconds >= 480 || seconds <= 0) return "--:--.---";
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(3);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(6, '0')}`;
        }

        function getTierIdx(tier) {
            if (!tier || tier === "-") return 999;
            return TIER_ORDER.indexOf(tier);
        }

        function getValidSum(p) {
            return Object.values(p.mapTiers).reduce((acc, m) => acc + (m.record < 120 ? m.record : 0), 0);
        }

        function render() {
            const body = document.getElementById('ranking-body');
            body.innerHTML = '';
            
            const dataSource = (currentGameMode === 'solos') ? players : (typeof duos !== 'undefined' ? duos : []);
            let sorted = [...dataSource];

            sorted.sort((a, b) => {
                if (currentMap === 'Overall') {
                    const sumA = getValidSum(a); const sumB = getValidSum(b);
                    if (sumA === 0) return 1; if (sumB === 0) return -1;
                    return sumA - sumB || b.rating - a.rating;
                } else {
                    const mA = a.mapTiers[currentMap]; const mB = b.mapTiers[currentMap];
                    const idxA = getTierIdx(mA.tier); const idxB = getTierIdx(mB.tier);
                    if (idxA !== idxB) return idxA - idxB;
                    return mA.record - mB.record || b.rating - a.rating;
                }
            });

            sorted.forEach((p, i) => {
                const isTop = i < 3;
                const rankClass = isTop ? `top-rank rank-${i+1}` : '';
                const name = p.name || p.pairName;
                const region = p.region || "JP";
                const title = p.title || "Combat Ace";
                
                let tiersHtml = '';
                if (currentMap === 'Overall') {
                    const maps = ['Cave', 'Flora', 'Gardens', 'Metropolis'];
                    maps.forEach(m => {
                        const d = p.mapTiers[m];
                        const tier = d ? d.tier : "-";
                        const labelClass = tier.startsWith("HT") ? "label-ht" : (tier.startsWith("LT") ? "label-lt" : "label-none");
                        tiersHtml += `
                            <div class="tier-mini-box">
                                <img src="maps/${m}.png" class="map-icon-img" onerror="this.style.opacity='0.2'">
                                <div class="tier-label ${labelClass}">${tier === "-" ? "-" : tier}</div>
                            </div>`;
                    });
                } else {
                    const d = p.mapTiers[currentMap];
                    const tier = d ? d.tier : "-";
                    const labelClass = tier.startsWith("HT") ? "label-ht" : (tier.startsWith("LT") ? "label-lt" : "label-none");
                    tiersHtml = `
                        <div class="tier-mini-box" style="transform: scale(1.2);">
                            <img src="maps/${currentMap}.png" class="map-icon-img">
                            <div class="tier-label ${labelClass}">${tier === "-" ? "-" : tier}</div>
                        </div>`;
                }

                const rawRecord = currentMap === 'Overall' ? getValidSum(p) : p.mapTiers[currentMap].record;

                body.innerHTML += `
                    <div class="rank-item ${rankClass}">
                        <div class="rank-number">${i + 1}</div>
                        <div class="skin-container">
                            <img src="skins/${p.name}.png" class="skin-img" onerror="this.src='skins/default.png'">
                        </div>
                        <div class="player-info">
                            <div class="player-name">${name}</div>
                            <div class="player-title"><span class="title-icon">◈</span> ${title} (${p.rating} pts)</div>
                        </div>
                        <div class="region-badge">${region}</div>
                        <div class="status-section">
                            <div class="time-box">
                                <span class="time-label">${currentMap.toUpperCase()} TIME</span>
                                <span class="time-value">${formatTime(rawRecord)}</span>
                            </div>
                            <div class="tiers-row">
                                ${tiersHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        window.onload = render;
    </script>
</body>
</html>
