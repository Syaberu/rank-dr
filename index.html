<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeathRun Rankings - Challenge Ladder</title>
    <link class="page-icon" rel="icon" href="maps/Cave.png" type="image/png">
    <script src="data.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --bg-body: #0a0a0c;
            --bg-card: #141417;
            --bg-nav: #1b1b1f;
            --accent-cyan: #00d2ff;
            --accent-purple: #bd00ff;
            --tier-ht: #ffb400;
            --tier-lt: #8e8e93;
            --text-main: #eeeeee;
            --text-sub: #8e8e93;
            --rank-1: linear-gradient(90deg, #ffb400 0%, #ff8c00 100%);
            --rank-2: linear-gradient(90deg, #b0b0b0 0%, #808080 100%);
            --rank-3: linear-gradient(90deg, #cd7f32 0%, #a0522d 100%);
        }

        * { box-sizing: border-box; }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .main-header { text-align: center; margin-bottom: 40px; }
        .main-header h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; text-transform: uppercase; letter-spacing: 8px; margin: 0; background: linear-gradient(to bottom, #fff 40%, #555 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4)); }
        .main-header .sub-text { color: var(--accent-cyan); font-size: 1.2rem; letter-spacing: 4px; font-weight: 700; }

        .header-nav { display: flex; gap: 15px; background: var(--bg-nav); padding: 8px; border-radius: 12px; margin-bottom: 25px; }
        .mode-btn { background: none; border: none; color: var(--text-sub); padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.95rem; transition: 0.3s; }
        .mode-btn.active { background: #2c2c34; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .section-title { font-size: 0.8rem; font-weight: 900; letter-spacing: 2px; color: var(--text-sub); text-transform: uppercase; margin: 15px 0 8px; width: 100%; max-width: 1200px; padding-left: 10px; }

        .map-tabs { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; width: 100%; max-width: 1200px; scrollbar-width: none; padding: 5px 10px; }
        .map-tabs::-webkit-scrollbar { display: none; }

        .map-tab { display: flex; align-items: center; gap: 10px; background: var(--bg-nav); border: 2px solid transparent; color: var(--text-sub); padding: 10px 18px; border-radius: 14px; cursor: pointer; font-size: 0.95rem; font-weight: 700; white-space: nowrap; transition: 0.2s; }
        
        .overall-icons { display: flex; gap: 2px; align-items: center; }
        .overall-icons .tab-icon { width: 16px; height: 16px; }
        .tab-icon { width: 20px; height: 20px; image-rendering: pixelated; pointer-events: none; }
        
        .map-tab:hover { background: #25252b; color: #fff; }
        .map-tab.active.rta-mode { background: #1a2936; border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .map-tab.active.vs-mode { background: #2a1a36; border-color: var(--accent-purple); color: var(--accent-purple); }

        .ranking-list { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 12px; }
        .rank-item { display: grid; grid-template-columns: 80px 80px 1fr 100px 480px; align-items: center; background-color: var(--bg-card); padding: 18px 0; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.2s; }
        .rank-item:hover { transform: translateY(-2px); background: #1a1a1e; }
        .rank-item.retired { opacity: 0.5; filter: grayscale(0.5); }

        .rank-item.top-rank::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; z-index: 5; }
        .rank-1::before { background: var(--rank-1); }
        .rank-2::before { background: var(--rank-2); }
        .rank-3::before { background: var(--rank-3); }

        .rank-number { font-size: 2.2rem; font-weight: 900; font-style: italic; text-align: center; color: #fff; }
        .skin-img { width: 60px; height: 60px; image-rendering: pixelated; border-radius: 8px; background: #222; border: 1px solid rgba(255,255,255,0.1); }
        .player-info { padding-left: 30px; min-width: 0; }
        .player-name { font-size: 1.4rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .player-title { font-size: 0.9rem; color: var(--text-sub); margin-top: 4px; }
        .region-badge { background: #2a2a2e; color: #ff4d4d; font-size: 0.85rem; font-weight: 800; padding: 6px 12px; border-radius: 6px; text-align: center; justify-self: center; }

        .status-section { display: flex; align-items: center; justify-content: flex-end; gap: 30px; padding-right: 30px; }
        .time-box { text-align: right; min-width: 140px; }
        .time-label { font-size: 0.7rem; color: var(--text-sub); display: block; margin-bottom: 2px; }
        .time-value { font-family: 'Consolas', monospace; font-weight: bold; font-size: 1.4rem; }
        .time-value.cyan { color: var(--accent-cyan); }
        .time-value.purple { color: var(--accent-purple); }

        .tiers-row { display: flex; gap: 12px; min-width: 280px; justify-content: flex-end; }
        .tier-mini-box { display: flex; flex-direction: column; align-items: center; width: 45px; }
        .map-icon-img { width: 22px; height: 22px; image-rendering: pixelated; margin-bottom: 6px; }
        .tier-label { font-size: 0.8rem; font-weight: 800; }
        .label-ht { color: #ffb400; }
        .label-lt { color: #8e8e93; }
        .label-none { color: #444; }

        /* 競争表示用グリッド */
        .vs-stats-grid { display: flex; gap: 15px; font-size: 0.85rem; color: var(--text-sub); font-weight: bold; }
        .vs-stat-item { background: rgba(255,255,255,0.03); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }
        .vs-stat-item span { color: #fff; }

        @media (max-width: 1100px) {
            .rank-item { grid-template-columns: 60px 70px 1fr 80px 300px; }
            .status-section { gap: 15px; padding-right: 15px; }
            .tiers-row { display: none; }
        }
        @media (max-width: 600px) {
            .main-header h1 { font-size: 2.2rem; }
            .map-tabs { justify-content: flex-start; }
            .rank-item { grid-template-columns: 50px 60px 1fr; padding: 12px 5px; }
            .status-section { grid-column: 1 / -1; justify-content: space-between; margin-top: 10px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
            .vs-stats-grid { gap: 5px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>DeathRun Rankings</h1>
        <div class="sub-text">COMPETITIVE LEADERBOARD</div>
    </header>

    <div class="header-nav">
        <button id="btn-active" class="mode-btn active" onclick="setRankType('active')">Active Rank</button>
        <button id="btn-all" class="mode-btn" onclick="setRankType('all')">All-Time Rank</button>
    </div>

    <div class="section-title">⏱️ Time Attack (RTA Record)</div>
    <div class="map-tabs">
        <button class="map-tab active rta-mode" data-cat="rta" onclick="updateMap('Overall', this)">
            <div class="overall-icons">
                <img src="maps/Cave.png" class="tab-icon">
                <img src="maps/Flora.png" class="tab-icon">
                <img src="maps/Gardens.png" class="tab-icon">
                <img src="maps/Metropolis.png" class="tab-icon">
                <img src="maps/Primus.png" class="tab-icon">
            </div>
            Overall
        </button>
        <button class="map-tab rta-mode" data-cat="rta" onclick="updateMap('Cave', this)"><img src="maps/Cave.png" class="tab-icon"> Cave</button>
        <button class="map-tab rta-mode" data-cat="rta" onclick="updateMap('Flora', this)"><img src="maps/Flora.png" class="tab-icon"> Flora</button>
        <button class="map-tab rta-mode" data-cat="rta" onclick="updateMap('Gardens', this)"><img src="maps/Gardens.png" class="tab-icon"> Gardens</button>
        <button class="map-tab rta-mode" data-cat="rta" onclick="updateMap('Metropolis', this)"><img src="maps/Metropolis.png" class="tab-icon"> Metropolis</button>
        <button class="map-tab rta-mode" data-cat="rta" onclick="updateMap('Primus', this)"><img src="maps/Primus.png" class="tab-icon"> Primus</button>
    </div>

    <div class="section-title">⚔️ Challenge Ladder (VS Mode)</div>
    <div class="map-tabs">
        <button class="map-tab vs-mode" data-cat="vs" onclick="updateMap('Random', this)"><img src="maps/Cave.png" class="tab-icon" style="filter: hue-rotate(140deg);"> Random</button>
        <button class="map-tab vs-mode" data-cat="vs" onclick="updateMap('Cave_VS', this)"><img src="maps/Cave.png" class="tab-icon"> Cave [VS]</button>
        <button class="map-tab vs-mode" data-cat="vs" onclick="updateMap('Flora_VS', this)"><img src="maps/Flora.png" class="tab-icon"> Flora [VS]</button>
        <button class="map-tab vs-mode" data-cat="vs" onclick="updateMap('Gardens_VS', this)"><img src="maps/Gardens.png" class="tab-icon"> Gardens [VS]</button>
        <button class="map-tab vs-mode" data-cat="vs" onclick="updateMap('Metropolis_VS', this)"><img src="maps/Metropolis.png" class="tab-icon"> Metropolis [VS]</button>
        <button class="map-tab vs-mode" data-cat="vs" onclick="updateMap('Primus_VS', this)"><img src="maps/Primus.png" class="tab-icon"> Primus [VS]</button>
    </div>

    <div class="ranking-list" id="ranking-body"></div>

    <script>
        let rankType = 'active';
        let currentMap = 'Overall';
        let currentCategory = 'rta';
        const mapsList = ['Cave', 'Flora', 'Gardens', 'Metropolis', 'Primus'];

        function setRankType(type) {
            rankType = type;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');
            render();
        }

        function updateMap(map, btn) {
            currentMap = map;
            currentCategory = btn.getAttribute('data-cat');
            document.querySelectorAll('.map-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function formatTime(seconds) {
            if (seconds <= 0 || seconds >= (120 * mapsList.length)) return "--:--.---";
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(3);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(6, '0')}`;
        }

        function getOverallSum(p) {
            return Object.values(p.mapTiers).reduce((acc, m) => acc + m.record, 0);
        }

        function getTierIdx(tier) {
            if (!tier || tier === "-") return 999;
            return TIER_ORDER.indexOf(tier);
        }

        // 勝率を計算する共通関数
        function calcWinRate(p) {
            if (!p.matches || p.matches === 0) return 0;
            return p.wins / p.matches;
        }

        function render() {
            const body = document.getElementById('ranking-body');
            body.innerHTML = '';
            
            let filtered = players.filter(p => rankType === 'all' || p.active);

            // --- ⚙️ 並び替えロジック ---
            filtered.sort((a, b) => {
                if (currentCategory === 'vs') {
                    // 💡 競争（VS）モード
                    const rA = (a.rank && a.rank > 0) ? a.rank : 999;
                    const rB = (b.rank && b.rank > 0) ? b.rank : 999;
                    
                    // 1. まず設定されたrankの数字が小さい順
                    if (rA !== rB) return rA - rB;
                    
                    // 2. 順位が同じ（またはどちらも0）なら、勝率が高い人が上
                    const rateA = calcWinRate(a);
                    const rateB = calcWinRate(b);
                    if (rateB !== rateA) return rateB - rateA;

                    // 3. 勝率も同じならRatingの高い順
                    return b.rating - a.rating;
                } else {
                    // RTAモード（最速タイム・Tier順）
                    if (currentMap === 'Overall') {
                        return getOverallSum(a) - getOverallSum(b);
                    } else {
                        const mA = a.mapTiers[currentMap];
                        const mB = b.mapTiers[currentMap];
                        const idxA = getTierIdx(mA.tier);
                        const idxB = getTierIdx(mB.tier);
                        if (idxA !== idxB) return idxA - idxB;
                        return mA.record - mB.record;
                    }
                }
            });

            filtered.forEach((p, i) => {
                const displayRank = i + 1;
                const isTop = displayRank <= 3;
                const rankClass = isTop ? `top-rank rank-${displayRank}` : '';
                const retiredClass = !p.active ? 'retired' : '';
                
                let statusSectionHtml = '';

                if (currentCategory === 'rta') {
                    // 【RTA表示】
                    let TiersInnerHtml = '';
                    if (currentMap === 'Overall') {
                        mapsList.forEach(m => {
                            const tier = p.mapTiers[m].tier;
                            const labelClass = tier.startsWith("HT") ? "label-ht" : (tier.startsWith("LT") ? "label-lt" : "label-none");
                            TiersInnerHtml += `<div class="tier-mini-box">
                                <img src="maps/${m}.png" class="map-icon-img" onerror="this.style.opacity='0.2'">
                                <div class="tier-label ${labelClass}">${tier}</div>
                            </div>`;
                        });
                    } else {
                        const tier = p.mapTiers[currentMap].tier;
                        const labelClass = tier.startsWith("HT") ? "label-ht" : (tier.startsWith("LT") ? "label-lt" : "label-none");
                        TiersInnerHtml = `<div class="tier-mini-box" style="transform: scale(1.3);"><img src="maps/${currentMap}.png" class="map-icon-img"><div class="tier-label ${labelClass}">${tier}</div></div>`;
                    }

                    const rawRecord = currentMap === 'Overall' ? getOverallSum(p) : p.mapTiers[currentMap].record;

                    statusSectionHtml = `
                        <div class="time-box">
                            <span class="time-label">${currentMap.toUpperCase()} RECORD</span>
                            <span class="time-value cyan">${formatTime(rawRecord)}</span>
                        </div>
                        <div class="tiers-row">
                            ${TiersInnerHtml}
                        </div>`;
                } else {
                    // 【VS表示】勝率・勝利数・試合数をリッチに表示
                    const winPercent = (calcWinRate(p) * 100).toFixed(1);
                    const pureMapName = currentMap.replace('_VS', '');

                    statusSectionHtml = `
                        <div class="time-box">
                            <span class="time-label">${pureMapName.toUpperCase()} LADDER</span>
                            <span class="time-value purple">Top ${displayRank}</span>
                        </div>
                        <div class="tiers-row" style="min-width: auto;">
                            <div class="vs-stats-grid">
                                <div class="vs-stat-item">WinRate: <span>${winPercent}%</span></div>
                                <div class="vs-stat-item">Wins: <span>${p.wins !== undefined ? p.wins : 0}</span></div>
                                <div class="vs-stat-item">Matches: <span>${p.matches !== undefined ? p.matches : 0}</span></div>
                            </div>
                        </div>`;
                }

                body.innerHTML += `
                    <div class="rank-item ${rankClass} ${retiredClass}">
                        <div class="rank-number">${displayRank}</div>
                        <div class="skin-container">
                            <img src="skins/${p.name}.png" class="skin-img" onerror="this.src='skins/default.png'">
                        </div>
                        <div class="player-info">
                            <div class="player-name">
                                ${p.name} ${!p.active ? '<span class="retired-tag">RETIRED</span>' : ''}
                            </div>
                            <div class="player-title"><span class="title-icon">◈</span> ${p.title}</div>
                        </div>
                        <div class="region-badge">${p.region}</div>
                        <div class="status-section">
                            ${statusSectionHtml}
                        </div>
                    </div>`;
            });
        }
        window.onload = render;
    </script>
</body>
</html>
